<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>사과 받기</title>
<style>
  :root {
    --sky-top: #8fd3ff;
    --sky-bottom: #e8f7ff;
    --ground: #6cc24a;
    --text: #1d2b36;
    --panel: rgba(255, 255, 255, 0.92);
    --accent: #e53935;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--sky-bottom); color: var(--text);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 12px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 20px; pointer-events: none;
    text-shadow: 0 1px 0 #fff;
  }
  #hud .lives { letter-spacing: 2px; }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--panel); border-radius: 20px; padding: 28px 24px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  .card h1 { margin: 0 0 8px; font-size: 32px; }
  .card p { margin: 6px 0; line-height: 1.5; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; text-align: left; margin: 16px auto; width: fit-content; }
  .legend span:nth-child(odd) { font-size: 22px; }
  button {
    margin-top: 14px; font: inherit; font-size: 18px; font-weight: 800;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 32px; cursor: pointer; box-shadow: 0 4px 0 #a32420;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a32420; }
  .hidden { display: none; }
  .best { opacity: 0.7; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div>🍎 <span id="score">0</span></div>
  <div class="lives" id="lives"></div>
</div>

<div id="start" class="overlay">
  <div class="card">
    <h1>🍎 사과 받기</h1>
    <p>바구니를 움직여 떨어지는 과일을 받으세요!</p>
    <div class="legend">
      <span>🍎</span><span>사과 +1점</span>
      <span>🍏</span><span>풋사과 +3점</span>
      <span>🌟</span><span>황금사과 +10점</span>
      <span>💣</span><span>폭탄 – 목숨 1개 감소</span>
    </div>
    <p>사과를 놓쳐도 목숨이 줄어요.</p>
    <p class="best">조작: ← → 키 / 마우스 / 터치</p>
    <button id="startBtn">시작하기</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h1>게임 오버</h1>
    <p style="font-size:22px">점수: <b id="finalScore">0</b></p>
    <p class="best">최고 기록: <span id="bestScore">0</span></p>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (basket) basket.y = H - groundH() - basket.h + 6;
  }
  const groundH = () => Math.max(50, H * 0.08);

  const TYPES = [
    { emoji: '🍎', points: 1,  weight: 70, bad: false },
    { emoji: '🍏', points: 3,  weight: 18, bad: false },
    { emoji: '🌟', points: 10, weight: 3,  bad: false },
    { emoji: '💣', points: 0,  weight: 14, bad: true  },
  ];
  const totalWeight = TYPES.reduce((s, t) => s + t.weight, 0);
  function pickType() {
    let r = Math.random() * totalWeight;
    for (const t of TYPES) { if ((r -= t.weight) < 0) return t; }
    return TYPES[0];
  }

  let basket, items, particles, popups, score, lives, running, spawnTimer, elapsed, lastT;
  const keys = { left: false, right: false };
  let pointerX = null;

  function getBest() { try { return +localStorage.getItem('apple-best') || 0; } catch { return 0; } }
  function setBest(v) { try { localStorage.setItem('apple-best', v); } catch {} }

  function reset() {
    const bw = Math.min(140, Math.max(90, W * 0.22));
    basket = { w: bw, h: bw * 0.5, x: W / 2 - bw / 2, y: 0, speed: 0 };
    basket.y = H - groundH() - basket.h + 6;
    items = []; particles = []; popups = [];
    score = 0; lives = 3; spawnTimer = 0; elapsed = 0;
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = '❤️'.repeat(lives) + '🤍'.repeat(Math.max(0, 3 - lives));
  }

  function spawn() {
    const t = pickType();
    const size = Math.min(48, Math.max(34, W * 0.07));
    const difficulty = 1 + elapsed / 30;
    items.push({
      type: t, size,
      x: size / 2 + Math.random() * (W - size),
      y: -size,
      vy: (140 + Math.random() * 80) * difficulty,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 3,
    });
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: 0.6, color });
    }
  }

  function loseLife() {
    lives--;
    updateHud();
    if (navigator.vibrate) navigator.vibrate(80);
    if (lives <= 0) gameOver();
  }

  function update(dt) {
    elapsed += dt;

    // basket movement
    const maxSpeed = Math.max(500, W * 1.2);
    if (pointerX !== null) {
      const target = pointerX - basket.w / 2;
      basket.x += (target - basket.x) * Math.min(1, dt * 18);
    } else {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      basket.x += dir * maxSpeed * dt;
    }
    basket.x = Math.max(0, Math.min(W - basket.w, basket.x));

    // spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.28, 0.9 - elapsed * 0.012);
    }

    // items
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      const r = it.size / 2;
      const caught =
        it.y + r > basket.y + 8 && it.y - r < basket.y + basket.h * 0.6 &&
        it.x > basket.x + 4 && it.x < basket.x + basket.w - 4;
      if (caught) {
        items.splice(i, 1);
        if (it.type.bad) {
          burst(it.x, it.y, '#555', 20);
          popups.push({ x: it.x, y: it.y, text: '펑!', life: 0.8, color: '#333' });
          loseLife();
        } else {
          score += it.type.points;
          burst(it.x, it.y, it.type.points >= 10 ? '#ffc400' : it.type.points >= 3 ? '#7cb342' : '#e53935');
          popups.push({ x: it.x, y: it.y, text: '+' + it.type.points, life: 0.8, color: '#1d2b36' });
          updateHud();
        }
        continue;
      }
      if (it.y - r > H - groundH() + 10) {
        items.splice(i, 1);
        if (!it.type.bad) {
          popups.push({ x: it.x, y: H - groundH() - 10, text: '놓침!', life: 0.8, color: '#e53935' });
          loseLife();
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 50 * dt; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#e8f7ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // clouds
    const t = performance.now() / 1000;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 260 + t * (12 + i * 4)) % (W + 200)) - 100;
      const cy = 70 + i * 55;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.arc(cx + 25, cy - 10, 28, 0, Math.PI * 2);
      ctx.arc(cx + 55, cy, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    // ground
    const gh = groundH();
    ctx.fillStyle = '#6cc24a'; ctx.fillRect(0, H - gh, W, gh);
    ctx.fillStyle = '#5aa83c'; ctx.fillRect(0, H - gh, W, 6);
  }

  function drawBasket() {
    const { x, y, w, h } = basket;
    ctx.save();
    ctx.fillStyle = '#a0632b';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w * 0.85, y + h);
    ctx.lineTo(x + w * 0.15, y + h);
    ctx.closePath();
    ctx.fill();
    // weave
    ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const yy = y + (h * i) / 4;
      const inset = (w * 0.15 * i) / 4;
      ctx.beginPath(); ctx.moveTo(x + inset, yy); ctx.lineTo(x + w - inset, yy); ctx.stroke();
    }
    // rim
    ctx.fillStyle = '#c47e3a';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x - 4, y - 6, w + 8, 10, 5) : ctx.rect(x - 4, y - 6, w + 8, 10);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    drawBackground();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.font = `${it.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(it.type.emoji, 0, 0);
      ctx.restore();
    }

    drawBasket();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    ctx.font = 'bold 22px system-ui, sans-serif';
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, p.life / 0.8);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    if (running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    $('start').classList.add('hidden');
    $('over').classList.add('hidden');
    $('hud').classList.remove('hidden');
  }

  function gameOver() {
    running = false;
    const best = Math.max(getBest(), score);
    setBest(best);
    $('finalScore').textContent = score;
    $('bestScore').textContent = best;
    $('over').classList.remove('hidden');
  }

  // input
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; pointerX = null; }
    if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; pointerX = null; }
    if ((e.key === 'Enter' || e.key === ' ') && !running) start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  canvas.addEventListener('pointermove', e => { pointerX = e.clientX; });
  canvas.addEventListener('pointerdown', e => { pointerX = e.clientX; });

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  window.addEventListener('resize', resize);

  resize();
  reset();
  requestAnimationFrame(t => { lastT = t; loop(t); });
})();
</script>
</body>
</html>
